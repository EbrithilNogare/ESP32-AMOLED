; Waveshare ESP32-S3-Touch-AMOLED-1.8 — see docs/HARDWARE.md for the full spec.
;
; Arduino core 3.x comes from the pioarduino fork (the stock PlatformIO
; espressif32 platform stopped at core 2.x). The platform is pinned so a build
; today and a build in a year produce the same firmware; bump it on purpose.

[platformio]
default_envs = amoled

; Shared device settings. Not a plain [env] section, so the host-test env
; below doesn't inherit the ESP32 board.
[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
; ESP32-S3R8 module: 16 MB QIO flash + 8 MB octal (OPI) PSRAM — exactly this board.
board = esp32-s3-devkitc1-n16r8
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
extra_scripts =
    pre:tools/version.py
    post:tools/size_check.py
build_flags =
    ; Serial goes over the native USB-C port (USB-Serial/JTAG), no UART chip on board.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
; Extra warnings for our own code only (src/), not for third-party libraries.
; The build must stay at 0 warnings.
build_src_flags =
    -Wall
    -Wextra
; Libraries: pinned git tags (see docs/LIBRARIES.md for why each one is here).
lib_deps =
    lvgl=https://github.com/lvgl/lvgl.git#v9.6.0
    XPowersLib=https://github.com/lewisxhe/XPowersLib.git#v0.3.3
    ArduinoJson=https://github.com/bblanchon/ArduinoJson.git#v7.4.3

; Release build: quiet core logs.
[env:amoled]
extends = esp32
build_flags =
    ${esp32.build_flags}
    -DCORE_DEBUG_LEVEL=1

; Debug build: debug-level core logs + APP_DEBUG for app-level logging.
; Not 5 (verbose): that logs every I2C transfer, and the PMU is polled every
; PMU_POLL_MS, which buries everything else.
[env:amoled-debug]
extends = esp32
build_type = debug
build_flags =
    ${esp32.build_flags}
    -DCORE_DEBUG_LEVEL=4
    -DAPP_DEBUG=1

; Wireless upload of the release build (System → Wireless update on the device).
; The password comes from the ESP_OTA_PASSWORD environment variable on the PC
; and must match OTA_PASSWORD in include/secrets.h.
[env:amoled-ota]
extends = env:amoled
upload_protocol = espota
; Must match OTA_HOSTNAME in include/config.h (+ ".local"); the ini can't read it.
upload_port = esp32-amoled.local
upload_flags =
    --auth=${sysenv.ESP_OTA_PASSWORD}

; Host tests for the Arduino-free logic in lib/ (`pio test -e native`).
[env:native]
platform = https://github.com/platformio/platform-native.git#v1.2.1
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
lib_compat_mode = strict
lib_deps =
    ArduinoJson=https://github.com/bblanchon/ArduinoJson.git#v7.4.3

; UI simulator + flow test on the PC: the real apps/UI/LVGL with the hardware
; modules stubbed (tools/sim/). `pio run -e sim -t exec` taps through every
; app, checks the results and writes frames for tools/sim/shots.py.
[env:sim]
platform = https://github.com/platformio/platform-native.git#v1.2.1
build_src_filter =
    +<apps/>
    +<ui/>
    +<core/settings.cpp>
    -<apps/home_assistant/ha_client.cpp>
    +<../tools/sim/>
build_src_flags = -Wall -Wextra  ; apps, ui and the simulator; LVGL stays quiet
build_flags =
    -std=gnu++17
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    -Isrc
    -Itools/sim
    -Itools/sim/shim
lib_deps =
    lvgl=https://github.com/lvgl/lvgl.git#v9.6.0
    ArduinoJson=https://github.com/bblanchon/ArduinoJson.git#v7.4.3
