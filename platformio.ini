; Waveshare ESP32-S3-Touch-AMOLED-1.8 — see docs/HARDWARE.md for the full spec.
;
; Arduino core 3.x comes from the pioarduino fork (the stock PlatformIO
; espressif32 platform stopped at core 2.x). The platform is pinned so a build
; today and a build in a year produce the same firmware; bump it on purpose.

[platformio]
default_envs = amoled

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
; ESP32-S3R8 module: 16 MB QIO flash + 8 MB octal (OPI) PSRAM — exactly this board.
board = esp32-s3-devkitc1-n16r8
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags =
    ; Serial goes over the native USB-C port (USB-Serial/JTAG), no UART chip on board.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
; Libraries for the onboard peripherals — uncomment what the app needs.
; Versions match the libraries bundled with Waveshare's own Arduino examples
; (see docs/HARDWARE.md#software).
lib_deps =
    ; moononournation/GFX Library for Arduino@1.6.4   ; SH8601 (V1) / CO5300 (V2) QSPI AMOLED
    ; lewisxhe/SensorLib@0.3.3                         ; QMI8658 IMU, PCF85063 RTC, FT3168/CST8xx touch
    ; lewisxhe/XPowersLib@0.2.6                        ; AXP2101 PMU
    ; adafruit/Adafruit XCA9554@1.0.0                  ; TCA9554 IO expander (LCD/touch reset)
    ; lvgl/lvgl@8.4.0                                  ; UI toolkit (vendor Arduino demos use v8)

; Release build: quiet core logs.
[env:amoled]
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=1

; Debug build: verbose core logs + APP_DEBUG for app-level logging.
[env:amoled-debug]
build_type = debug
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=5
    -DAPP_DEBUG=1
