# [[sprite]]
# name   = "steam"                   # -> sprite_steam, sprite_steam_frames[]
# file   = "sprites/steam/sheet.png"
# frame  = [64, 64]                  # w, h of one frame
# frames = 12                        # read row by row, left to right
